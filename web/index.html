<!doctype html>
<html lang="en" data-brand="wbc">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credit Dragon — Westpac</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="gel-notch"></div>

      <header class="gel-topbar">
        <div class="gel-statusbar">
          <span id="status-time">9:41</span>
          <span class="gel-status-icons">
            <span class="gel-signal"><i></i><i></i><i></i><i></i></span>
            <span class="gel-battery"><span class="gel-battery-fill"></span></span>
          </span>
        </div>
        <div class="gel-header-main">
          <div class="gel-brandrow">
            <img class="gel-logo" src="assets/gel/wbc-logo.svg" alt="Westpac">
            <div>
              <span class="gel-brand">Westpac</span>
              <span class="gel-brand-sub">Credit Dragon</span>
            </div>
          </div>
          <span class="gel-coin-pill"><span class="gel-coin"></span><span id="header-coins">0</span></span>
        </div>
      </header>

      <main class="gel-screen" id="screen" aria-live="polite"></main>

      <nav class="gel-tabbar" id="tabbar">
        <button class="gel-tab active" data-tab="bills"><span class="gel-ico tab-ico" style="--ico:url(assets/gel/icons/receipt-outlined.svg)"></span>Bills</button>
        <button class="gel-tab" data-tab="goals"><span class="gel-ico tab-ico" style="--ico:url(assets/gel/icons/target-outlined.svg)"></span>Goals</button>
        <button class="gel-tab" data-tab="dragon"><span class="gel-ico tab-ico" style="--ico:url(assets/gel/icons/paw-outlined.svg)"></span>Dragon</button>
        <button class="gel-tab" data-tab="shop"><span class="gel-ico tab-ico" style="--ico:url(assets/gel/icons/shopping-bag-outlined.svg)"></span>Shop</button>
      </nav>

      <div class="gel-toast" id="toast" role="status"></div>
      <div id="modal-root"></div>
    </div>
  </div>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
