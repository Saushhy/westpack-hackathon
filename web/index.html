<!doctype html>
<html lang="en" data-brand="wbc">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credit Dragon — Westpac</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="stage">
    <div class="phone">
      <header class="gel-header">
        <div>
          <span class="gel-brand">Westpac</span>
          <span class="gel-brand-sub">Credit Dragon</span>
        </div>
        <span class="gel-coin-pill"><span class="gel-coin"></span><span id="header-coins">0</span></span>
      </header>

      <main class="gel-screen" id="screen" aria-live="polite"></main>

      <nav class="gel-tabbar" id="tabbar">
        <button class="gel-tab active" data-tab="bills"><span class="tab-ico">💸</span>Bills</button>
        <button class="gel-tab" data-tab="goals"><span class="tab-ico">🎯</span>Goals</button>
        <button class="gel-tab" data-tab="dragon"><span class="tab-ico">🐉</span>Dragon</button>
        <button class="gel-tab" data-tab="shop"><span class="tab-ico">🛍️</span>Shop</button>
      </nav>

      <div class="gel-toast" id="toast" role="status"></div>
      <div id="modal-root"></div>
    </div>
  </div>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
